<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Support Portal</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">
      <div class="brand">
        <div class="logo" aria-hidden="true">SP</div>
        <div>
          <h1 id="login-title">Support Portal</h1>
          <p class="subtitle">Customer &amp; agent login — page 1</p>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div id="alert" class="alert hidden" role="alert"></div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <label for="role">Sign in as</label>
        <select id="role" name="role">
          <option value="customer">Customer</option>
          <option value="agent">Support Agent</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit" id="submit-btn">Sign in</button>
      </form>

      <p class="demo-hint">Demo credentials: <code>demo@support.com</code> / <code>demo1234</code></p>
      <p class="meta">Project workspace page 1 · SSH Demo</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
